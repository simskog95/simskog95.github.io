<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Alkoflash – öva inför kunskapsprovet om alkohollagstiftningen med flashkort och quiz.">
<title>Alkoflash – kunskapsprov om alkohollagstiftningen</title>
<style>
  :root {
    --bg: #f7f5f2;
    --surface: #ffffff;
    --surface-2: #f0ece6;
    --text: #1c1917;
    --muted: #6b6560;
    --border: #e2dcd4;
    --accent: #b45309;
    --accent-text: #ffffff;
    --accent-soft: #fdf3e7;
    --good: #15803d;
    --good-soft: #ecfdf3;
    --bad: #b91c1c;
    --bad-soft: #fef2f2;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(28, 25, 23, .06), 0 10px 30px -18px rgba(28, 25, 23, .45);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14120f;
      --surface: #1e1b17;
      --surface-2: #272219;
      --text: #f5f1ea;
      --muted: #a8a29a;
      --border: #342e26;
      --accent: #f59e0b;
      --accent-text: #1c1917;
      --accent-soft: #2b2213;
      --good: #4ade80;
      --good-soft: #10261a;
      --bad: #f87171;
      --bad-soft: #2b1414;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 30px -18px rgba(0, 0, 0, .9);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }

  /* ---------- header ---------- */

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0 22px;
  }

  .logo {
    flex: none;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 800;
    font-size: 1.15rem;
    letter-spacing: -.02em;
  }

  .topbar h1 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -.01em;
  }

  .topbar p {
    margin: 0;
    font-size: .8rem;
    color: var(--muted);
  }

  /* ---------- generic ---------- */

  h2 {
    margin: 0 0 8px;
    font-size: clamp(1.35rem, 1.1rem + 1vw, 1.7rem);
    letter-spacing: -.02em;
    line-height: 1.25;
  }

  h3 {
    margin: 0 0 12px;
    font-size: .8rem;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }

  .lede {
    color: var(--muted);
    font-size: .95rem;
    max-width: 54ch;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
  }

  .panel-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 12px;
  }

  .panel-head h3 { margin: 0; }
  .panel-head .spacer { flex: 1; }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    font: inherit;
    font-size: .9rem;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }

  .chip:hover { border-color: var(--accent); }

  .chip[aria-pressed="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  .chip:disabled {
    opacity: .4;
    cursor: not-allowed;
  }

  .chip .count {
    font-size: .75rem;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--muted);
  }

  .chip[aria-pressed="true"] .count {
    background: var(--accent);
    color: var(--accent-text);
  }

  .btn {
    font: inherit;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: transform .12s, background .15s, border-color .15s, opacity .15s;
  }

  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }

  .btn-primary:hover:not(:disabled) { filter: brightness(1.06); }

  .btn-lg {
    width: 100%;
    padding: 16px 22px;
    font-size: 1.02rem;
  }

  .btn-got {
    flex: 1;
    background: var(--good-soft);
    border-color: var(--good);
    color: var(--good);
  }

  .btn-miss {
    flex: 1;
    background: var(--bad-soft);
    border-color: var(--bad);
    color: var(--bad);
  }

  .link {
    font: inherit;
    font-size: .85rem;
    background: none;
    border: 0;
    padding: 4px 6px;
    color: var(--muted);
    cursor: pointer;
    border-radius: 6px;
  }

  .link:hover { color: var(--accent); text-decoration: underline; }

  /* ---------- setup ---------- */

  .start-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 20px;
  }

  .start-note {
    text-align: center;
    font-size: .82rem;
    color: var(--muted);
  }

  .about {
    margin-top: 22px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
    font-size: .88rem;
    color: var(--muted);
  }

  .about summary {
    cursor: pointer;
    font-weight: 600;
    color: var(--text);
    padding: 4px 0;
  }

  .about ul { margin: 10px 0 12px; padding-left: 20px; }
  .about li { margin-bottom: 6px; }
  .about a { color: var(--accent); }

  /* ---------- card screen ---------- */

  .hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .counter {
    font-size: .82rem;
    font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .progress {
    height: 6px;
    border-radius: 999px;
    background: var(--surface-2);
    overflow: hidden;
    margin-bottom: 20px;
  }

  .progress > span {
    display: block;
    height: 100%;
    border-radius: 999px;
    background: var(--accent);
    transition: width .3s ease;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    min-height: 220px;
  }

  .card-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }

  .badge {
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--muted);
  }

  .badge-alkoholpolitik { background: #e3edff; color: #1d4ed8; }
  .badge-servering { background: #fdf0dd; color: #b45309; }
  .badge-tillsyn { background: #e4f7ec; color: #15803d; }

  @media (prefers-color-scheme: dark) {
    .badge-alkoholpolitik { background: #16233d; color: #93b8ff; }
    .badge-servering { background: #2e2211; color: #f5b955; }
    .badge-tillsyn { background: #12281c; color: #6ee7a0; }
  }

  .topic {
    font-size: .78rem;
    color: var(--muted);
    text-transform: capitalize;
  }

  .question {
    margin: 0;
    font-size: clamp(1.12rem, 1rem + .9vw, 1.4rem);
    font-weight: 650;
    letter-spacing: -.015em;
    line-height: 1.4;
    text-wrap: pretty;
  }

  .answer {
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px dashed var(--border);
    animation: rise .28s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  .answer-text {
    margin: 0 0 12px;
    font-size: 1.02rem;
    font-weight: 600;
  }

  .explanation {
    margin: 0 0 14px;
    font-size: .94rem;
    color: var(--muted);
  }

  .law {
    margin: 0;
    font-size: .8rem;
    color: var(--muted);
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .law span {
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .actions .btn { padding: 15px 20px; }

  .kbd-hints {
    margin-top: 14px;
    text-align: center;
    font-size: .76rem;
    color: var(--muted);
  }

  kbd {
    font-family: inherit;
    font-size: .72rem;
    padding: 1px 5px;
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 5px;
    background: var(--surface-2);
  }

  @media (hover: none) {
    .kbd-hints { display: none; }
  }

  /* ---------- quiz ---------- */

  .options { margin-top: 20px; display: flex; flex-direction: column; gap: 9px; }

  .opt {
    font: inherit;
    font-size: .95rem;
    text-align: left;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    width: 100%;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: border-color .15s, background .15s, opacity .15s;
  }

  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }

  .opt .key {
    flex: none;
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--muted);
    font-size: .74rem;
    font-weight: 700;
  }

  .opt.is-correct {
    border-color: var(--good);
    background: var(--good-soft);
    color: var(--good);
    font-weight: 600;
  }

  .opt.is-correct .key { background: var(--good); color: var(--surface); }

  .opt.is-wrong {
    border-color: var(--bad);
    background: var(--bad-soft);
    color: var(--bad);
  }

  .opt.is-wrong .key { background: var(--bad); color: var(--surface); }

  .opt.is-dim { opacity: .5; }
  .opt:disabled { cursor: default; }

  /* ---------- result ---------- */

  .score {
    text-align: center;
    padding: 26px 18px 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }

  .score-num {
    font-size: 3.2rem;
    font-weight: 800;
    letter-spacing: -.04em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .score-num span { font-size: 1.4rem; font-weight: 600; color: var(--muted); }

  .score-sub { margin: 8px 0 4px; color: var(--muted); font-size: .9rem; }
  .score-msg { margin: 0; font-size: .92rem; }

  .cat-row { margin-bottom: 12px; }
  .cat-row:last-child { margin-bottom: 0; }

  .cat-row-head {
    display: flex;
    justify-content: space-between;
    font-size: .85rem;
    margin-bottom: 5px;
    font-variant-numeric: tabular-nums;
  }

  .cat-row-head span:last-child { color: var(--muted); }

  .cat-row .progress { margin-bottom: 0; height: 5px; }

  .missed-item {
    border-top: 1px solid var(--border);
    padding: 14px 0;
  }

  .missed-item:first-of-type { border-top: 0; padding-top: 4px; }

  .missed-item .q { font-weight: 600; font-size: .92rem; margin: 0 0 8px; }

  .missed-item .a {
    font-size: .88rem;
    margin: 0 0 4px;
    color: var(--good);
    font-weight: 600;
  }

  .missed-item .your {
    font-size: .84rem;
    color: var(--bad);
    margin: 0 0 6px;
  }

  .foot {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: .76rem;
    color: var(--muted);
    text-align: center;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

  @media (max-width: 480px) {
    .app { padding: 14px 12px 40px; }
    .card { padding: 20px 18px; }
    .panel { padding: 16px 14px; }
  }
</style>

gst 2,25 volymprocent alkohol?","answer":"Lättdryck.","options":["Lättdryck.","Folköl.","Starköl.","Alkoholdrycksliknande preparat."],"correct":0,"explanation":"Lättdryck är den samlade benämningen för alkoholfria drycker och drycker med högst 2,25 volymprocent alkohol.","law":"1 kap. 5 § AL"},{"id":"alp-003","category":"alkoholpolitik","topic":"definitioner","question":"Vilken alkoholhalt har folköl?","answer":"Över 2,25 men inte 3,5 volymprocent.","options":["Över 2,25 men inte 3,5 volymprocent.","Högst 2,25 volymprocent.","Över 3,5 volymprocent.","Över 22 volymprocent."],"correct":0,"explanation":"Folköl är öl med alkoholhalt över 2,25 men inte 3,5 volymprocent.","law":"1 kap. 8 § AL"},{"id":"alp-004","category":"alkoholpolitik","topic":"definitioner","question":"Vilken alkoholhalt har starköl?","answer":"Över 3,5 volymprocent.","options":["Över 3,5 volymprocent.","Över 2,25 men inte 3,5 volymprocent.","Högst 2,25 volymprocent.","Exakt 22 volymprocent."],"correct":0,"explanation":"Starköl är öl med alkoholhalt över 3,5 volymprocent.","law":"1 kap. 8 § AL"},{"id":"alp-005","category":"alkoholpolitik","topic":"definitioner","question":"Vad är en spritdryck enligt alkohollagen?","answer":"En alkoholdryck som innehåller sprit.","options":["En alkoholdryck som innehåller sprit.","En alkoholdryck som framställts genom jäsning av druvor.","En alkoholdryck med högst 3,5 volymprocent alkohol.","En alkoholdryck som är alkoholfri."],"correct":0,"explanation":"Lagens definition utgår från att drycken innehåller sprit. I praktiken har spritdrycker oftast över 22 volymprocent.","law":"1 kap. 6 § AL"},{"id":"alp-006","category":"alkoholpolitik","topic":"definitioner","question":"Vad avses med vin enligt alkohollagen?","answer":"En alkoholdryck framställd genom jäsning av druvor eller druvsaft, inklusive vin med tillsatt sprit av vinprodukter om alkoholhalten inte överstiger 22 volymprocent.","options":["En alkoholdryck framställd genom jäsning av druvor eller druvsaft, inklusive vin med tillsatt sprit av vinprodukter om alkoholhalten inte överstiger 22 volymprocent.","Alla drycker som framställts genom jäsning av frukt eller bär.","Endast drycker med en alkoholhalt över 22 volymprocent.","Alla alkoholdrycker som inte är öl."],"correct":0,"explanation":"Vin är jäst druva eller druvsaft. Spritat vin räknas som vin om alkoholhalten inte överstiger 22 volymprocent.","law":"1 kap. 7 § AL"},{"id":"alp-007","category":"alkoholpolitik","topic":"definitioner","question":"Vad är en annan jäst alkoholdryck?","answer":"En alkoholdryck framställd genom jäsning av frukt, bär eller andra växtdelar som inte är vin eller öl.","options":["En alkoholdryck framställd genom jäsning av frukt, bär eller andra växtdelar som inte är vin eller öl.","En alkoholdryck som innehåller sprit.","Ett alkoholhaltigt preparat som inte är en dryck.","Öl med en alkoholhalt över 3,5 volymprocent."],"correct":0,"explanation":"Cider är ett typiskt exempel på en annan jäst alkoholdryck.","law":"1 kap. 9 § AL"},{"id":"alp-008","category":"alkoholpolitik","topic":"definitioner","question":"Vad kännetecknar ett alkoholdrycksliknande preparat?","answer":"Ett alkoholhaltigt preparat som ur konsumtionssynpunkt är att jämställa med alkoholdrycker eller annars kan antas användas som berusningsmedel.","options":["Ett alkoholhaltigt preparat som ur konsumtionssynpunkt är att jämställa med alkoholdrycker eller annars kan antas användas som berusningsmedel.","En dryck som är alkoholfri eller har högst 2,25 volymprocent alkohol.","Ett läkemedel som innehåller alkohol.","En dryck som endast får säljas på Systembolaget."],"correct":0,"explanation":"Vid bedömningen beaktas preparatets sammansättning och smak, om det går att omvandla till en alkoholdryck och hur det marknadsförs.","law":"1 kap. 10 a § AL"},{"id":"alp-009","category":"alkoholpolitik","topic":"definitioner","question":"Vad menas med servering enligt alkohollagen?","answer":"Försäljning av alkoholdrycker eller alkoholdrycksliknande preparat för intag på stället.","options":["Försäljning av alkoholdrycker eller alkoholdrycksliknande preparat för intag på stället.","All försäljning av alkoholdrycker till konsument.","Försäljning av alkoholdrycker mellan näringsidkare.","Tillverkning av alkoholdrycker för eget bruk."],"correct":0,"explanation":"Servering är försäljning för förtäring på plats. Annan försäljning till konsument är detaljhandel.","law":"1 kap. 11 § AL"},{"id":"alp-010","category":"alkoholpolitik","topic":"definitioner","question":"Vad menas med detaljhandel?","answer":"Försäljning till konsument.","options":["Försäljning till konsument.","Försäljning mellan näringsidkare.","Försäljning för intag på stället.","Tillverkning för försäljning."],"correct":0,"explanation":"Detaljhandel är försäljning till konsument. För alkoholdrycker sker den i huvudsak genom det statliga detaljhandelsbolaget.","law":"1 kap. 11 § AL"},{"id":"alp-011","category":"alkoholpolitik","topic":"definitioner","question":"Vad menas med partihandel?","answer":"Annan försäljning än försäljning till konsument.","options":["Annan försäljning än försäljning till konsument.","Försäljning till konsument.","Servering för intag på stället.","Försäljning av folköl i dagligvaruhandeln."],"correct":0,"explanation":"Partihandel är försäljning mellan näringsidkare och kräver godkännande som upplagshavare eller registrerad varumottagare enligt alkoholskattelagen.","law":"1 kap. 11 § AL"},{"id":"alp-012","category":"alkoholpolitik","topic":"definitioner","question":"Vad är teknisk sprit?","answer":"Sprit som är avsedd för tekniskt, industriellt, medicinskt, vetenskapligt eller annat jämförligt ändamål.","options":["Sprit som är avsedd för tekniskt, industriellt, medicinskt, vetenskapligt eller annat jämförligt ändamål.","Sprit som är avsedd att drickas.","Sprit som framställts genom jäsning av druvor.","Sprit som säljs på Systembolaget."],"correct":0,"explanation":"Teknisk sprit är inte avsedd som dryck och omfattas av särskilda regler om bland annat denaturering.","law":"1 kap. 4 § AL"},{"id":"alp-013","category":"alkoholpolitik","topic":"definitioner","question":"Vad avses med alkohol i alkohollagen?","answer":"Etylalkohol.","options":["Etylalkohol.","Metanol.","Alla typer av alkoholer.","Teknisk sprit."],"correct":0,"explanation":"Alkohollagen definierar alkohol som etylalkohol.","law":"1 kap. 3 § AL"},{"id":"alp-014","category":"alkoholpolitik","topic":"alkoholpolitik","question":"Vad är målet med den svenska alkoholpolitiken?","answer":"Att främja folkhälsan genom att minska alkoholens medicinska och sociala skadeverkningar.","options":["Att främja folkhälsan genom att minska alkoholens medicinska och sociala skadeverkningar.","Att öka försäljningen av svenska alkoholdrycker.","Att göra alkohol billigare och mer tillgänglig.","Att avskaffa alla regler om alkohol."],"correct":0,"explanation":"Det övergripande målet är folkhälsa, och en restriktiv lagstiftning är det främsta instrumentet.","law":"Alkoholpolitiken"},{"id":"alp-015","category":"alkoholpolitik","topic":"alkoholpolitik","question":"Vilket är det mest grundläggande politiska instrumentet för att nå alkoholpolitikens mål?","answer":"En restriktiv lagstiftning på alkoholområdet.","options":["En restriktiv lagstiftning på alkoholområdet.","Sänkta alkoholskatter.","Fler försäljningsställen och längre öppettider.","Ökad alkoholreklam."],"correct":0,"explanation":"Alkohollagen begränsar tillgängligheten genom bland annat monopol, priser, försäljningsställen, tider och marknadsföringsregler.","law":"Alkoholpolitiken"},{"id":"alp-016","category":"alkoholpolitik","topic":"alkoholpolitik","question":"Vilka exempel på begränsningar används i alkohollagen för att minska den skadliga alkoholkonsumtionen?","answer":"Detaljhandelsmonopol, prisnivå, antal försäljningsställen, öppettider och marknadsföringsregler.","options":["Detaljhandelsmonopol, prisnivå, antal försäljningsställen, öppettider och marknadsföringsregler.","Endast höga straff för rattfylleri.","Endast informationskampanjer i skolan.","Endast frivilliga överenskommelser med branschen."],"correct":0,"explanation":"Detta är de begränsningar som Folkhälsomyndigheten lyfter fram som centrala i den svenska alkoholpolitiken.","law":"Alkoholpolitiken"},{"id":"alp-017","category":"alkoholpolitik","topic":"alkoholpolitik","question":"Vad innebär detaljhandelsmonopolet?","answer":"Endast det statliga detaljhandelsbolaget får bedriva detaljhandel med spritdrycker, vin, starköl, andra jästa alkoholdrycker och alkoholdrycksliknande preparat.","options":["Endast det statliga detaljhandelsbolaget får bedriva detaljhandel med spritdrycker, vin, starköl, andra jästa alkoholdrycker och alkoholdrycksliknande preparat.","Alla butiker får sälja alkohol om de har tillstånd.","Kommunerna äger alla alkoholbutiker.","Endast restauranger får sälja alkohol."],"correct":0,"explanation":"Systembolaget är det särskilt bildade statliga aktiebolag som har monopol på detaljhandel med alkoholdrycker.","law":"5 kap. 1–2 §§ AL"},{"id":"alp-018","category":"alkoholpolitik","topic":"alkoholpolitik","question":"Vem äger detaljhandelsbolaget?","answer":"Staten.","options":["Staten.","Kommunerna.","Branschorganisationerna.","EU."],"correct":0,"explanation":"Detaljhandelsbolaget ska ägas av staten enligt 5 kap. 1 § AL.","law":"5 kap. 1 § AL"},{"id":"alp-019","category":"alkoholpolitik","topic":"alkoholpolitik","question":"Varför kallas alkohollagen en social skyddslagstiftning?","answer":"Därför att syftet är att skydda människors hälsa och begränsa alkoholens skadeverkningar.","options":["Därför att syftet är att skydda människors hälsa och begränsa alkoholens skadeverkningar.","Därför att den reglerar sociala medier.","Därför att den endast gäller för socialtjänsten.","Därför att den skyddar näringsidkarnas vinster."],"correct":0,"explanation":"Lagen är i första hand en skyddslagstiftning för folkhälsan, inte en näringslivsstödjande lag.","law":"Alkoholpolitiken"},{"id":"alp-020","category":"alkoholpolitik","topic":"alkoholpolitik","question":"Hur förhåller sig det svenska detaljhandelsmonopolet till EU-rätten?","answer":"Det har bedömts vara förenligt med EU-rätten under förutsättning att monopolet inte diskriminerar varor från andra länder.","options":["Det har bedömts vara förenligt med EU-rätten under förutsättning att monopolet inte diskriminerar varor från andra länder.","Det är förbjudet enligt EU-rätten och får inte tillämpas.","Det gäller endast för svenska produkter.","Det har aldrig prövats av EU-domstolen."],"correct":0,"explanation":"EU-domstolen har accepterat ett detaljhandelsmonopol om det är motiverat av folkhälsoskäl och inte diskriminerar importerade varor.","law":"Alkoholpolitiken"},{"id":"alp-021","category":"alkoholpolitik","topic":"marknadsföring","question":"Vilken grundregel gäller vid marknadsföring av alkoholdrycker till konsumenter?","answer":"Särskild måttfullhet ska iakttas, och marknadsföringen får inte vara påträngande, uppsökande eller uppmana till bruk av alkohol.","options":["Särskild måttfullhet ska iakttas, och marknadsföringen får inte vara påträngande, uppsökande eller uppmana till bruk av alkohol.","Marknadsföringen får vara hur påträngande som helst.","Endast prisinformation får förekomma.","Marknadsföring är helt förbjuden i alla kanaler."],"correct":0,"explanation":"Kravet på särskild måttfullhet är grundläggande för all marknadsföring av alkoholdrycker och alkoholdrycksliknande preparat.","law":"7 kap. 1 § AL"},{"id":"alp-022","category":"alkoholpolitik","topic":"marknadsföring","question":"Vilken åldersgräns gäller för att marknadsföring inte får rikta sig särskilt till eller skildra barn och ungdomar?","answer":"25 år.","options":["25 år.","18 år.","20 år.","21 år."],"correct":0,"explanation":"Marknadsföring får inte rikta sig särskilt till eller skildra barn eller ungdomar som inte har fyllt 25 år.","law":"7 kap. 1 § AL"},{"id":"alp-023","category":"alkoholpolitik","topic":"marknadsföring","question":"Får kommersiella annonser för alkoholdrycker användas i tv-sändningar eller ljudradio?","answer":"Nej, det är förbjudet.","options":["Nej, det är förbjudet.","Ja, utan begränsningar.","Ja, men endast efter klockan 22.","Ja, om drycken har högst 15 volymprocent."],"correct":0,"explanation":"Kommersiella annonser för alkoholdrycker får inte användas i tv-sändningar, beställ-tv eller ljudradio.","law":"7 kap. 3 § AL"},{"id":"alp-024","category":"alkoholpolitik","topic":"marknadsföring","question":"Får alkoholdrycker med mer än 15 volymprocent alkohol annonseras i periodiska skrifter?","answer":"Nej, inte i sådana skrifter, med undantag för skrifter som endast tillhandahålls på försäljningsstället.","options":["Nej, inte i sådana skrifter, med undantag för skrifter som endast tillhandahålls på försäljningsstället.","Ja, utan begränsningar.","Ja, om annonsen är mindre än en helsida.","Ja, om drycken är svenskproducerad."],"correct":0,"explanation":"Förbudet gäller periodiska skrifter och andra skrifter som är jämförbara med periodiska skrifter enligt tryckfrihetsförordningen.","law":"7 kap. 4 § AL"},{"id":"alp-025","category":"alkoholpolitik","topic":"marknadsföring","question":"Får en näringsidkare lämna alkoholdrycker som gåva i sin rörelse?","answer":"Endast i form av varuprov.","options":["Endast i form av varuprov.","Ja, i obegränsad omfattning.","Nej, aldrig.","Endast till anställda."],"correct":0,"explanation":"Alkoholdrycker får i en rörelse lämnas som gåva endast i form av varuprov.","law":"7 kap. 2 § AL"},{"id":"alp-026","category":"alkoholpolitik","topic":"marknadsföring","question":"Får alkoholdrycker lämnas som gåva vid marknadsföring av tjänster eller försäljning av andra varor?","answer":"Nej, det är förbjudet.","options":["Nej, det är förbjudet.","Ja, om gåvan är liten.","Ja, om kunden är över 25 år.","Ja, om det sker i butik."],"correct":0,"explanation":"Vid marknadsföring av tjänster eller försäljning av andra varor får alkoholdrycker inte lämnas som gåva.","law":"7 kap. 2 § AL"},{"id":"alp-027","category":"alkoholpolitik","topic":"definitioner","question":"Vilken dryck räknas inte som en alkoholdryck?","answer":"Lättöl.","options":["Lättöl.","Folköl.","Starköl.","Cider med 4,5 volymprocent alkohol."],"correct":0,"explanation":"Lättöl har högst 2,25 volymprocent och är därför en lättdryck, inte en alkoholdryck.","law":"1 kap. 5 § AL"},{"id":"alp-028","category":"alkoholpolitik","topic":"alkoholpolitik","question":"Vilken är alkohollagens beteckning?","answer":"SFS 2010:1622.","options":["SFS 2010:1622.","SFS 2011:1622.","SFS 1994:1738.","SFS 2026:511."],"correct":0,"explanation":"Alkohollagen (2010:1622) trädde i kraft den 1 januari 2011 och ersatte den tidigare alkohollagen (1994:1738).","law":"Alkohollagen"},{"id":"alp-029","category":"alkoholpolitik","topic":"alkoholpolitik","question":"Varför är en restriktiv alkoholpolitik viktig ur folkhälsosynpunkt?","answer":"Den begränsar tillgängligheten och bidrar därmed till att minska alkoholens medicinska och sociala skador.","options":["Den begränsar tillgängligheten och bidrar därmed till att minska alkoholens medicinska och sociala skador.","Den ökar statens intäkter från alkoholskatten.","Den gör det lättare för unga att köpa alkohol.","Den minskar konkurrensen mellan restauranger."],"correct":0,"explanation":"Restriktiv lagstiftning är det främsta instrumentet för att nå målet om minskade medicinska och sociala skadeverkningar.","law":"Alkoholpolitiken"},{"id":"alp-030","category":"alkoholpolitik","topic":"alkoholpolitik","question":"Vem beslutar om alkohollagen?","answer":"Riksdagen.","options":["Riksdagen.","Folkhälsomyndigheten.","Kommunfullmäktige.","Regeringen."],"correct":0,"explanation":"Alkohollagen är en lag som beslutas av riksdagen. Folkhälsomyndigheten meddelar föreskrifter med stöd av lagen.","law":"Alkohollagen"},{"id":"ser-001","category":"servering","topic":"tillstånd","question":"När krävs serveringstillstånd?","answer":"För servering av spritdrycker, vin, starköl, andra jästa alkoholdrycker och alkoholdrycksliknande preparat.","options":["För servering av spritdrycker, vin, starköl, andra jästa alkoholdrycker och alkoholdrycksliknande preparat.","För all servering av alkoholhaltiga drycker, inklusive folköl.","Endast för servering av spritdrycker.","Endast vid servering till allmänheten."],"correct":0,"explanation":"Folköl och lättdrycker omfattas inte av tillståndskravet, men folkölsservering har egna regler.","law":"8 kap. 1 § AL"},{"id":"ser-002","category":"servering","topic":"tillstånd","question":"I vilken kommun ansöker man om serveringstillstånd?","answer":"I kommunen där serveringsstället är beläget.","options":["I kommunen där serveringsstället är beläget.","I kommunen där företaget har sitt säte.","I kommunen där ägaren bor.","Hos länsstyrelsen i länet."],"correct":0,"explanation":"Huvudregeln är att tillstånd meddelas av kommunen där serveringsstället ligger.","law":"8 kap. 1 § AL"},{"id":"ser-003","category":"servering","topic":"tillstånd","question":"Vem meddelar serveringstillstånd?","answer":"Den kommun där serveringsstället är beläget.","options":["Den kommun där serveringsstället är beläget.","Folkhälsomyndigheten.","Polismyndigheten.","Länsstyrelsen."],"correct":0,"explanation":"Kommunen är tillståndsmyndighet. Polisen yttrar sig, och Folkhälsomyndigheten har den övergripande tillsynen.","law":"8 kap. 1 § AL"},{"id":"ser-004","category":"servering","topic":"tillstånd","question":"Vilka två huvudtyper av serveringstillstånd finns med avseende på vilka gästerna är?","answer":"Servering till allmänheten eller servering i slutet sällskap.","options":["Servering till allmänheten eller servering i slutet sällskap.","Servering inomhus eller utomhus.","Servering med mat eller utan mat.","Servering av öl eller av vin."],"correct":0,"explanation":"Tillstånd kan meddelas för servering till allmänheten eller i förening, företag eller annat slutet sällskap.","law":"8 kap. 2 § AL"},{"id":"ser-005","category":"servering","topic":"tillstånd","question":"Vilka två huvudtyper av serveringstillstånd finns med avseende på giltighetstiden?","answer":"Stadigvarande och tillfälligt serveringstillstånd.","options":["Stadigvarande och tillfälligt serveringstillstånd.","Allmänt och slutet serveringstillstånd.","Inomhus- och utomhustillstånd.","Sommar- och vintertillstånd."],"correct":0,"explanation":"Stadigvarande tillstånd gäller året runt eller årligen under en viss period. Tillfälligt tillstånd gäller en enstaka period eller ett enstaka tillfälle.","law":"8 kap. 2 § AL"},{"id":"ser-006","category":"servering","topic":"tillstånd","question":"Får ett serveringstillstånd begränsas till vissa drycker?","answer":"Ja, tillståndet kan gälla alla eller en eller flera av dryckerna.","options":["Ja, tillståndet kan gälla alla eller en eller flera av dryckerna.","Nej, tillståndet gäller alltid alla drycker.","Nej, det gäller endast spritdrycker.","Ja, men endast för folköl."],"correct":0,"explanation":"Tillståndet kan avse spritdrycker, vin, starköl, andra jästa alkoholdrycker och alkoholdrycksliknande preparat eller ett urval av dessa.","law":"8 kap. 2 § AL"},{"id":"ser-007","category":"servering","topic":"tillstånd","question":"Vilken ålder krävs för att få serveringstillstånd?","answer":"20 år.","options":["20 år.","18 år.","21 år.","25 år."],"correct":0,"explanation":"Den som inte har fyllt 20 år får inte bedriva näringsverksamhet som innefattar försäljning av alkoholdrycker.","law":"3 kap. 6 § AL"},{"id":"ser-008","category":"servering","topic":"tillstånd","question":"Vilka tre lämplighetskrav prövas vid ansökan om serveringstillstånd?","answer":"Personlig lämplighet, ekonomisk lämplighet och tillräckliga kunskaper om alkohollagen.","options":["Personlig lämplighet, ekonomisk lämplighet och tillräckliga kunskaper om alkohollagen.","Personlig lämplighet, lokalens storlek och antal anställda.","Ekonomisk lämplighet, antal sittplatser och kökets storlek.","Endast ekonomisk lämplighet."],"correct":0,"explanation":"Kommunen prövar personlig och ekonomisk lämplighet samt kunskaper. Sedan 2026 finns inget krav på mat, kök eller sittplatser.","law":"8 kap. 12 § AL"},{"id":"ser-009","category":"servering","topic":"tillstånd","question":"När måste Polismyndighetens yttrande inhämtas?","answer":"Vid ansökan om stadigvarande serveringstillstånd och vid tillfälligt tillstånd till allmänheten om det inte är fråga om ett arrangemang av endast obetydlig omfattning.","options":["Vid ansökan om stadigvarande serveringstillstånd och vid tillfälligt tillstånd till allmänheten om det inte är fråga om ett arrangemang av endast obetydlig omfattning.","Endast vid ansökan om tillfälligt tillstånd.","Endast vid ansökan om servering i slutet sällskap.","Aldrig."],"correct":0,"explanation":"Polisen ska yttra sig över sökandens allmänna lämplighet och de omständigheter som ligger till grund för bedömningen.","law":"8 kap. 11 § AL"},{"id":"ser-010","category":"servering","topic":"tillstånd","question":"Hur ska en ansökan om serveringstillstånd göras?","answer":"Skriftligen till kommunen.","options":["Skriftligen till kommunen.","Muntligen till Polismyndigheten.","Via Folkhälsomyndighetens webbplats.","Till länsstyrelsen."],"correct":0,"explanation":"Ansökan ska göras skriftligen till den kommun där serveringsstället är beläget.","law":"8 kap. 10 § AL"},{"id":"ser-011","category":"servering","topic":"tillstånd","question":"Får kommunen ta ut en avgift för prövningen av en ansökan?","answer":"Ja, enligt grunder som kommunfullmäktige beslutar.","options":["Ja, enligt grunder som kommunfullmäktige beslutar.","Nej, prövningen är alltid gratis.","Ja, men endast för tillfälliga tillstånd.","Endast Folkhälsomyndigheten får ta ut avgift."],"correct":0,"explanation":"Kommunen får ta ut avgift för prövning och tillsyn enligt grunder som kommunfullmäktige beslutar.","law":"8 kap. 10 § AL"},{"id":"ser-012","category":"servering","topic":"prov","question":"Hur stor andel rätta svar krävs per delområde för att bli godkänd på kunskapsprovet?","answer":"Minst 75 procent per delområde.","options":["Minst 75 procent per delområde.","Minst 50 procent totalt.","Minst 90 procent totalt.","Minst 60 procent per delområde."],"correct":0,"explanation":"Provet är indelat i tre delområden, och godkänt kräver minst 75 procent rätta svar i varje delområde.","law":"HSLF-FS 2026:20"},{"id":"ser-013","category":"servering","topic":"prov","question":"Hur länge kan ett godkänt kunskapsprov användas vid ansökan?","answer":"I upp till fem år.","options":["I upp till fem år.","I upp till ett år.","I upp till tio år.","Endast vid det aktuella ansökningstillfället."],"correct":0,"explanation":"Serveringstillstånd kan sökas baserat på ett godkänt provresultat i upp till fem år.","law":"HSLF-FS 2026:20"},{"id":"ser-014","category":"servering","topic":"tillstånd","question":"När krävs inte serveringstillstånd?","answer":"Vid ett enstaka tillfälle för i förväg bestämda personer, utan vinstintresse och utan annan kostnad för deltagarna än inköp av dryckerna, i lokaler utan yrkesmässig försäljning av alkohol eller lättdrycker.","options":["Vid ett enstaka tillfälle för i förväg bestämda personer, utan vinstintresse och utan annan kostnad för deltagarna än inköp av dryckerna, i lokaler utan yrkesmässig försäljning av alkohol eller lättdrycker.","När serveringen sker i en restaurang med matservering.","När serveringen sker till allmänheten.","När serveringen sker varje vecka."],"correct":0,"explanation":"Alla tre förutsättningarna måste vara uppfyllda för att undantaget ska gälla.","law":"8 kap. 1 a § AL"},{"id":"ser-015","category":"servering","topic":"folköl","question":"Krävs serveringstillstånd för att servera folköl?","answer":"Nej, men verksamheten ska anmälas till kommunen och ha ett egenkontrollprogram.","options":["Nej, men verksamheten ska anmälas till kommunen och ha ett egenkontrollprogram.","Ja, all servering av folköl kräver serveringstillstånd.","Nej, och det finns inga krav på anmälan eller egenkontroll.","Ja, men endast om folkölet serveras efter klockan 22."],"correct":0,"explanation":"Folkölsservering kräver ingen tillståndsprövning men ska anmälas innan den påbörjas. Lokalen ska vara godkänd eller registrerad enligt livsmedelslagen.","law":"8 kap. 8 § AL"},{"id":"ser-016","category":"servering","topic":"åldersgränser","question":"Vilken ålder gäller för att få serveras alkohol på ett serveringsställe?","answer":"18 år.","options":["18 år.","20 år.","21 år.","25 år."],"correct":0,"explanation":"Alkoholdrycker får serveras till den som har fyllt 18 år. Åldersgränsen 20 år gäller vid köp i detaljhandeln.","law":"3 kap. 7 § AL"},{"id":"ser-017","category":"servering","topic":"personal","question":"Vem är serveringsansvarig?","answer":"En person som tillståndshavaren utser att ha tillsyn över serveringen och som ska vara närvarande under hela serveringstiden.","options":["En person som tillståndshavaren utser att ha tillsyn över serveringen och som ska vara närvarande under hela serveringstiden.","Den gäst som har bokat bord.","Kommunens alkoholhandläggare.","Polismyndighetens kontaktperson."],"correct":0,"explanation":"Undantag från kravet att vara närvarande gäller vid rumsservering på hotell.","law":"8 kap. 18 § AL"},{"id":"ser-018","category":"servering","topic":"personal","question":"Vilken ålder ska den serveringsansvarige ha?","answer":"Minst 20 år.","options":["Minst 20 år.","Minst 18 år.","Minst 21 år.","Minst 25 år."],"correct":0,"explanation":"Den serveringsansvarige ska ha fyllt 20 år och vara lämplig för uppgiften.","law":"8 kap. 18 § AL"},{"id":"ser-019","category":"servering","topic":"personal","question":"Ska serveringsansvarig anmälas till kommunen?","answer":"Ja.","options":["Ja.","Nej, det räcker att informera personalen.","Endast om personen är under 25 år.","Endast vid tillfälliga tillstånd."],"correct":0,"explanation":"Tillståndshavaren ska till kommunen anmäla den eller de personer som utsetts att ansvara för serveringen.","law":"8 kap. 18 § AL"},{"id":"ser-020","category":"servering","topic":"personal","question":"Vilka får anlitas som köks- eller serveringspersonal eller för uppgifter av betydelse för ordning och nykterhet?","answer":"Endast den som är anställd av tillståndshavaren eller inhyrd från ett bemanningsföretag.","options":["Endast den som är anställd av tillståndshavaren eller inhyrd från ett bemanningsföretag.","Vem som helst, även obehöriga och tillfälliga gäster.","Endast personer som har serveringstillstånd.","Endast personer som är över 25 år."],"correct":0,"explanation":"Kravet gäller även den som utför uppgifter av betydelse för ordning och nykterhet.","law":"8 kap. 18 § AL"},{"id":"ser-021","category":"servering","topic":"personal","question":"Vilka undantag finns från kravet på anställd eller inhyrd personal?","answer":"Ordningsvakter som förordnats enligt lagen om ordningsvakter och elever vid restaurangskolor i utbildningssyfte.","options":["Ordningsvakter som förordnats enligt lagen om ordningsvakter och elever vid restaurangskolor i utbildningssyfte.","Alla som arbetar ideellt.","Gästernas vänner och familj.","Personer som har ett eget serveringstillstånd."],"correct":0,"explanation":"Restaurangskolor med serveringstillstånd får, efter överenskommelse med skolan, anlita elever i utbildningssyfte.","law":"8 kap. 18 § AL"},{"id":"ser-022","category":"servering","topic":"personal","question":"Får ett annat företag än tillståndshavaren sköta matserveringen på serveringsstället?","answer":"Nej, all köks- och serveringspersonal ska vara anställd av tillståndshavaren eller inhyrd från ett bemanningsföretag.","options":["Nej, all köks- och serveringspersonal ska vara anställd av tillståndshavaren eller inhyrd från ett bemanningsföretag.","Ja, om det andra företaget har F-skatt.","Ja, om maten är färdiglagad.","Ja, om kommunen godkänner det."],"correct":0,"explanation":"Bestämmelsen har inte ändrats i samband med att matkravet slopades. Tillståndshavaren och dennes personal ska sköta all servering.","law":"8 kap. 18 § AL"},{"id":"ser-023","category":"servering","topic":"catering","question":"Vad gäller för ett stadigvarande serveringstillstånd för cateringverksamhet för slutna sällskap?","answer":"Tillståndet gäller för catering, och den lokal där serveringen sker ska anmälas till och godkännas av kommunen för varje tillfälle.","options":["Tillståndet gäller för catering, och den lokal där serveringen sker ska anmälas till och godkännas av kommunen för varje tillfälle.","Tillståndet gäller endast den egna restaurangens matsal.","Tillståndet gäller utan krav på anmälan av lokal.","Tillståndet gäller endast servering till allmänheten."],"correct":0,"explanation":"Catering är servering för slutna sällskap i hemmet eller i en tillfälligt hyrd lokal. Lokalen ska godkännas för varje tillfälle.","law":"8 kap. 4 § AL"},{"id":"ser-024","category":"servering","topic":"catering","question":"Måste en cateringverksamhet tillhandahålla mat?","answer":"Ja, catering innebär servering av färdiglagad mat och alkoholdrycker på beställning av slutna sällskap.","options":["Ja, catering innebär servering av färdiglagad mat och alkoholdrycker på beställning av slutna sällskap.","Nej, catering får endast servera alkoholdrycker.","Nej, matkravet slopades helt 2026.","Ja, men endast om kunden beställer minst tre rätter."],"correct":0,"explanation":"Kravet på eget kök slopades 2026, men catering ska fortfarande tillhandahålla färdiglagad mat.","law":"8 kap. 4 § AL"},{"id":"ser-025","category":"servering","topic":"catering","question":"Får en cateringverksamhet servera enbart alkoholdrycker?","answer":"Nej, då krävs i stället ett tillfälligt serveringstillstånd för slutna sällskap.","options":["Nej, då krävs i stället ett tillfälligt serveringstillstånd för slutna sällskap.","Ja, om kunden är ett företag.","Ja, om serveringen sker i hemmet.","Ja, om alkoholen köps på Systembolaget."],"correct":0,"explanation":"Cateringbegreppet förutsätter färdiglagad mat. Enbart alkohol kräver ett tillfälligt tillstånd för slutna sällskap.","law":"8 kap. 4 § AL"},{"id":"ser-026","category":"servering","topic":"hotell","question":"När får rumsservering av alkohol ske på ett hotell?","answer":"När hotellet har restaurangverksamhet med serveringstillstånd i sina lokaler.","options":["När hotellet har restaurangverksamhet med serveringstillstånd i sina lokaler.","När gästen har bokat ett dyrare rum.","När hotellet ligger i en kommun som tillåter det.","Alltid, utan särskilda krav."],"correct":0,"explanation":"Rumsservering och minibar är tillåtna på hotell som har restaurangverksamhet med serveringstillstånd.","law":"8 kap. 5 § AL"},{"id":"ser-027","category":"servering","topic":"hotell","question":"Får minibar finnas på hotellrum?","answer":"Ja, om hotellet har restaurangverksamhet med serveringstillstånd.","options":["Ja, om hotellet har restaurangverksamhet med serveringstillstånd.","Nej, minibar är alltid förbjuden.","Ja, om minibaren endast innehåller folköl.","Ja, om gästen är över 25 år."],"correct":0,"explanation":"Minibar får finnas på hotellrum när hotellet har restaurangverksamhet med serveringstillstånd.","law":"8 kap. 5 § AL"},{"id":"ser-028","category":"servering","topic":"kryddning","question":"Vad krävs för att få krydda spritdryck för servering som snaps i den egna serveringsrörelsen?","answer":"Stadigvarande tillstånd att servera spritdrycker och en anmälan till kommunen.","options":["Stadigvarande tillstånd att servera spritdrycker och en anmälan till kommunen.","Endast ett tillfälligt serveringstillstånd.","Ingenting, det är alltid tillåtet.","Tillstånd från Folkhälsomyndigheten."],"correct":0,"explanation":"Kryddning av snaps är tillåten i den egna serveringsrörelsen efter anmälan till kommunen.","law":"8 kap. 3 § AL"},{"id":"ser-029","category":"servering","topic":"kryddning","question":"Får en tillståndshavare blanda alkoholdrycker med andra ingredienser i förväg och servera som shots?","answer":"Nej, det är inte tillåtet att tillverka, omförpacka eller buteljera alkoholdrycker. Endast kryddning av snaps är tillåten.","options":["Nej, det är inte tillåtet att tillverka, omförpacka eller buteljera alkoholdrycker. Endast kryddning av snaps är tillåten.","Ja, om shotarna serveras i små glas.","Ja, om blandningen görs i köket.","Ja, om gästen beställer dem i förväg."],"correct":0,"explanation":"Tillståndshavaren får inte tillverka, omförpacka eller buteljera alkoholdrycker. Kryddning av snaps är ett särskilt undantag.","law":"8 kap. 3 § AL"},{"id":"ser-030","category":"servering","topic":"provsmakning","question":"Vad krävs för provsmakning av alkoholdrycker vid ett arrangemang riktat till allmänheten?","answer":"Att arrangören har ett stadigvarande serveringstillstånd som omfattar dryckerna och lokalen, eller att partihandlare får ett tillfälligt tillstånd för provsmakning. Anmälan krävs.","options":["Att arrangören har ett stadigvarande serveringstillstånd som omfattar dryckerna och lokalen, eller att partihandlare får ett tillfälligt tillstånd för provsmakning. Anmälan krävs.","Att arrangören har ett tillfälligt serveringstillstånd för slutet sällskap.","Att arrangören endast serverar folköl.","Att arrangören har tillstånd från Polismyndigheten."],"correct":0,"explanation":"Provsmakning riktad till allmänheten kräver antingen ett befintligt serveringstillstånd som täcker dryckerna och lokalen, eller ett tillfälligt provsmakningstillstånd för partihandlare.","law":"8 kap. 6 § AL"},{"id":"ser-031","category":"servering","topic":"serveringstider","question":"Vem beslutar under vilka tider alkohol får serveras?","answer":"Kommunen.","options":["Kommunen.","Polismyndigheten.","Folkhälsomyndigheten.","Riksdagen."],"correct":0,"explanation":"Kommunen beslutar om serveringstiderna och ska särskilt beakta risken för olägenheter för ordning och nykterhet.","law":"8 kap. 19 § AL"},{"id":"ser-032","category":"servering","topic":"serveringstider","question":"Vilka tider gäller för servering om kommunen inte beslutat annat?","answer":"Tidigast klockan 11.00 och senast klockan 01.00.","options":["Tidigast klockan 11.00 och senast klockan 01.00.","Tidigast klockan 10.00 och senast klockan 02.00.","Tidigast klockan 12.00 och senast klockan 24.00.","Dygnet runt."],"correct":0,"explanation":"Om kommunen inte beslutat annat får servering inte påbörjas före 11.00 och inte pågå efter 01.00.","law":"8 kap. 19 § AL"},{"id":"ser-033","category":"servering","topic":"serveringstider","question":"När ska serveringsstället vara utrymt?","answer":"Senast 30 minuter efter serveringstidens utgång.","options":["Senast 30 minuter efter serveringstidens utgång.","Senast 15 minuter efter serveringstidens utgång.","Senast 60 minuter efter serveringstidens utgång.","Det finns ingen tidsgräns."],"correct":0,"explanation":"Gästerna ska ha lämnat lokalen senast 30 minuter efter att serveringstiden har tagit slut.","law":"8 kap. 19 § AL"},{"id":"ser-034","category":"servering","topic":"serveringstider","question":"Gäller de allmänna serveringstiderna för rumsservering och minibar?","answer":"Nej.","options":["Nej.","Ja, alltid.","Ja, men endast på vardagar.","Endast om kommunen beslutar det."],"correct":0,"explanation":"Bestämmelserna om serveringstider och utrymning gäller inte rumsservering på hotell eller minibar i hotellrum.","law":"8 kap. 19 § AL"},{"id":"ser-035","category":"servering","topic":"ordning","question":"Vilka krav gäller för lättdrycker på ett serveringsställe?","answer":"Lättdrycker ska finnas att tillgå i tillfredsställande urval och omfattning.","options":["Lättdrycker ska finnas att tillgå i tillfredsställande urval och omfattning.","Lättdrycker får inte serveras alls.","Det räcker att det finns kranvatten.","Lättdrycker kräver särskilt tillstånd."],"correct":0,"explanation":"Kravet syftar till att gäster ska kunna välja alkoholfria alternativ.","law":"8 kap. 22 § AL"},{"id":"ser-036","category":"servering","topic":"prissättning","question":"Vilken prisregel gäller för alkoholdrycker vid servering?","answer":"Priset får inte sättas lägre än inköpspriset jämte skäligt påslag.","options":["Priset får inte sättas lägre än inköpspriset jämte skäligt påslag.","Priset får sättas hur lågt som helst.","Priset måste vara högst inköpspriset.","Priset bestäms alltid av kommunen."],"correct":0,"explanation":"Priset ska täcka inköpspriset och ge ett skäligt påslag. Prissättningen får inte heller gynna starkare drycker.","law":"8 kap. 21 § AL"},{"id":"ser-037","category":"servering","topic":"prissättning","question":"Får prissättningen främja drycker med högre alkoholhalt?","answer":"Nej.","options":["Nej.","Ja, om det sker i annonser.","Ja, om kommunen godkänner det.","Ja, under happy hour."],"correct":0,"explanation":"Prissättningen får inte ske så att försäljning av drycker med högre alkoholhalt främjas.","law":"8 kap. 21 § AL"},{"id":"ser-038","category":"servering","topic":"prissättning","question":"Får gästerna uppmanas eller förmås att köpa alkoholdrycker?","answer":"Nej, det är förbjudet.","options":["Nej, det är förbjudet.","Ja, om det sker diskret.","Ja, av personalen.","Ja, om gästen är över 25 år."],"correct":0,"explanation":"Det finns ett animeringsförbud: gäster får inte uppmanas eller förmås att köpa alkoholdrycker.","law":"8 kap. 21 § AL"},{"id":"ser-039","category":"servering","topic":"prissättning","question":"Får alkohol bjudas gratis på ett serveringsställe?","answer":"Nej, priset får inte understiga inköpspriset jämte skäligt påslag.","options":["Nej, priset får inte understiga inköpspriset jämte skäligt påslag.","Ja, om det sker vid ett företagsevent.","Ja, om gästen har köpt mat.","Ja, under happy hour."],"correct":0,"explanation":"Gratis alkohol innebär ett pris under inköpspriset och strider därför mot prissättningsregeln.","law":"8 kap. 21 § AL"},{"id":"ser-040","category":"servering","topic":"ordning","question":"Får en gäst ta med sig alkohol från ett serveringsställe?","answer":"Nej, inte från ett serveringsställe med serveringstillstånd. Undantag gäller hotellrum med minibar.","options":["Nej, inte från ett serveringsställe med serveringstillstånd. Undantag gäller hotellrum med minibar.","Ja, om flaskan är oöppnad.","Ja, om gästen har betalat för den.","Ja, alltid."],"correct":0,"explanation":"Alkohol som serverats i lokalen får inte medföras från serveringsstället. Undantaget gäller hotellrum med minibar.","law":"8 kap. 23 § AL"},{"id":"ser-041","category":"servering","topic":"ordning","question":"Får en gäst ta med egen alkohol till ett serveringsställe?","answer":"Nej, på ett serveringsställe får endast alkohol som serverats enligt tillståndet förtäras.","options":["Nej, på ett serveringsställe får endast alkohol som serverats enligt tillståndet förtäras.","Ja, om gästen betalar korkavgift.","Ja, om det är folköl.","Ja, om gästen sitter på uteserveringen."],"correct":0,"explanation":"Det är förbjudet att förtära eller tillåta förtäring av andra alkoholdrycker än de som serverats enligt tillståndet. Undantag gäller hotellrum.","law":"8 kap. 24 § AL"},{"id":"ser-042","category":"servering","topic":"ordning","question":"Får alkohol som inte får serveras förvaras på serveringsstället?","answer":"Nej, det är förbjudet.","options":["Nej, det är förbjudet.","Ja, i låsta skåp.","Ja, om den är för personalen.","Ja, om den är inköpt på Systembolaget."],"correct":0,"explanation":"Alkoholdrycker som inte får serveras i lokalen får inte heller förvaras där eller i tillhörande utrymmen.","law":"8 kap. 24 § AL"},{"id":"ser-043","category":"servering","topic":"ordning","question":"Gäller förbuden mot att ta med alkohol ut och mot att förtära egen alkohol för folköl?","answer":"Nej, förbuden gäller inte folköl.","options":["Nej, förbuden gäller inte folköl.","Ja, alla förbud gäller även folköl.","Ja, men endast på uteserveringar.","Endast om kommunen beslutar det."],"correct":0,"explanation":"Förbuden i 8 kap. 24 § gäller inte folköl, och 23 § omfattar inte folköl.","law":"8 kap. 24 § AL"},{"id":"ser-044","category":"servering","topic":"ordning","question":"Vad innebär kravet på måttfullhet vid servering?","answer":"Ansvarig personal ska se till att måttfullhet iakttas och att störningar på grund av oordning eller onykterhet undviks.","options":["Ansvarig personal ska se till att måttfullhet iakttas och att störningar på grund av oordning eller onykterhet undviks.","Gästerna ska själva ansvara för att inte dricka för mycket.","Det räcker att personalen inte serverar sprit.","Måttfullhet gäller endast efter klockan 24."],"correct":0,"explanation":"Ansvarig personal har en aktiv skyldighet att förebygga oordning och onykterhet.","law":"8 kap. 20 § AL"},{"id":"ser-045","category":"servering","topic":"ordning","question":"Får alkohol serveras till en gäst som är märkbart påverkad?","answer":"Nej.","options":["Nej.","Ja, om gästen har ätit.","Ja, om gästen är över 25 år.","Ja, om det är folköl."],"correct":0,"explanation":"Alkoholdrycker får inte lämnas ut till den som är märkbart påverkad av alkohol eller andra berusningsmedel.","law":"3 kap. 8 § AL"},{"id":"ser-046","category":"servering","topic":"åldersgränser","question":"Måste personalen förvissa sig om gästens ålder?","answer":"Ja, den som lämnar ut alkohol ska förvissa sig om att mottagaren har uppnått föreskriven ålder.","options":["Ja, den som lämnar ut alkohol ska förvissa sig om att mottagaren har uppnått föreskriven ålder.","Nej, det räcker att gästen ser vuxen ut.","Nej, ålderskontroll är frivillig.","Endast om gästen är under 25 år."],"correct":0,"explanation":"Personalen ska kontrollera åldern vid osäkerhet. Legitimationskontroll är ett vanligt sätt att fullgöra skyldigheten.","law":"3 kap. 8 § AL"},{"id":"ser-047","category":"servering","topic":"åldersgränser","question":"Får en gäst som är under 18 år serveras alkohol om det serveras mat?","answer":"Nej, på ett serveringsställe gäller 18-årsgränsen utan undantag.","options":["Nej, på ett serveringsställe gäller 18-årsgränsen utan undantag.","Ja, om måltiden kostar tillräckligt mycket.","Ja, om föräldrarna är med.","Ja, om det endast är folköl."],"correct":0,"explanation":"Undantaget för att bjuda en minderårig på en mindre mängd gäller inte på serveringsställe. Där gäller 18 år.","law":"3 kap. 9 § AL"},{"id":"ser-048","category":"servering","topic":"åldersgränser","question":"Vad är ett ombudsköp?","answer":"Att någon anskaffar alkohol åt en person som inte själv får köpa den.","options":["Att någon anskaffar alkohol åt en person som inte själv får köpa den.","Att en restaurang köper alkohol från en partihandlare.","Att en gäst beställer alkohol via en app.","Att kommunen köper alkohol för kontroll."],"correct":0,"explanation":"Det är förbjudet att som ombud eller på jämförbart sätt anskaffa alkohol till någon som inte får lämnas ut alkohol.","law":"3 kap. 9 § AL"},{"id":"ser-049","category":"servering","topic":"åldersgränser","question":"Får en vuxen köpa alkohol till en minderårig vän på en restaurang?","answer":"Nej, det är förbjudet att anskaffa alkohol till någon som inte får lämnas ut alkohol.","options":["Nej, det är förbjudet att anskaffa alkohol till någon som inte får lämnas ut alkohol.","Ja, om den vuxne betalar.","Ja, om den minderårige äter mat.","Ja, om det sker diskret."],"correct":0,"explanation":"Ombudsköp och liknande anskaffning till minderåriga är förbjuden och kan leda till straffansvar.","law":"3 kap. 9 § AL"},{"id":"ser-050","category":"servering","topic":"ordning","question":"Vad bör personalen göra om en gäst är påverkad och vill ha mer alkohol?","answer":"Vägra servering, erbjuda vatten eller mat och vid behov be gästen lämna stället.","options":["Vägra servering, erbjuda vatten eller mat och vid behov be gästen lämna stället.","Servera ändå för att undvika bråk.","Servera endast folköl.","Ring alltid polisen direkt."],"correct":0,"explanation":"Personalen ska agera ansvarsfullt och förebygga oordning och onykterhet.","law":"8 kap. 20 § AL"},{"id":"ser-051","category":"servering","topic":"lokaler","question":"Vad ska ett serveringstillstånd omfatta för utrymme?","answer":"Ett visst avgränsat utrymme som disponeras av tillståndshavaren.","options":["Ett visst avgränsat utrymme som disponeras av tillståndshavaren.","Hela fastigheten.","Alla kommunens offentliga platser.","Endast inomhuslokalen."],"correct":0,"explanation":"Tillståndet ska avse ett avgränsat utrymme. Sedan 2026 finns inget krav på inomhuslokal.","law":"8 kap. 14 § AL"},{"id":"ser-052","category":"servering","topic":"lokaler","question":"Får flera tillståndshavare använda ett gemensamt serveringsutrymme?","answer":"Ja, om särskilt tillstånd har meddelats.","options":["Ja, om särskilt tillstånd har meddelats.","Nej, det är alltid förbjudet.","Ja, utan något särskilt tillstånd.","Endast om de har samma ägare."],"correct":0,"explanation":"Särskilt tillstånd kan meddelas för flera tillståndshavare att utnyttja ett gemensamt serveringsutrymme.","law":"8 kap. 14 § AL"},{"id":"ser-053","category":"servering","topic":"lokaler","question":"Vilka krav gäller för serveringslokaler ur brandsäkerhetssynpunkt?","answer":"Lokalerna ska vara lämpliga från brandsäkerhetssynpunkt.","options":["Lokalerna ska vara lämpliga från brandsäkerhetssynpunkt.","Det finns inga brandkrav för serveringslokaler.","Endast köket behöver vara brandsäkert.","Brandkrav gäller endast vid tillfälliga tillstånd."],"correct":0,"explanation":"Lokaler för servering till allmänheten eller för stadigvarande servering i slutet sällskap ska vara lämpliga från brandsäkerhetssynpunkt.","law":"8 kap. 16 § AL"},{"id":"ser-054","category":"servering","topic":"lokaler","question":"Får kommunen vägra serveringstillstånd på grund av serveringsställets belägenhet?","answer":"Ja, om serveringen kan befaras medföra olägenheter för ordning och nykterhet eller särskild risk för människors hälsa.","options":["Ja, om serveringen kan befaras medföra olägenheter för ordning och nykterhet eller särskild risk för människors hälsa.","Nej, belägenheten får aldrig beaktas.","Endast om grannarna har klagat skriftligt.","Endast om serveringsstället ligger utanför detaljplanen."],"correct":0,"explanation":"8 kap. 17 § AL ger kommunen möjlighet att vägra tillstånd av ordnings- och hälsoskäl.","law":"8 kap. 17 § AL"},{"id":"ser-055","category":"servering","topic":"lokaler","question":"Gäller kravet på matservering och eget kök fortfarande?","answer":"Nej, mat- och kökskravet slopades den 1 juni 2026.","options":["Nej, mat- och kökskravet slopades den 1 juni 2026.","Ja, alla serveringstillstånd kräver eget kök.","Ja, men endast för spritdrycker.","Nej, det slopades redan 2011."],"correct":0,"explanation":"Genom lagändringen 2026 avskaffades kravet på matservering och eget kök för serveringstillstånd.","law":"8 kap. 15 § AL (upphävd 2026)"},{"id":"ser-056","category":"servering","topic":"lokaler","question":"Gäller krav på sittplatser och drinkbarer?","answer":"Nej, bestämmelserna slopades 2026.","options":["Nej, bestämmelserna slopades 2026.","Ja, alla serveringsställen måste ha sittplatser.","Ja, men endast drinkbarer är tillåtna.","Ja, det krävs minst 20 sittplatser."],"correct":0,"explanation":"I samband med att mat- och kökskravet slopades avskaffades även bestämmelserna om sittplatser och drinkbarer.","law":"8 kap. AL (2026)"},{"id":"ser-057","category":"servering","topic":"inköp","question":"Var får en restaurang med serveringstillstånd köpa spritdrycker, vin, starköl och andra jästa alkoholdrycker?","answer":"Av partihandlare eller av detaljhandelsbolaget (Systembolaget).","options":["Av partihandlare eller av detaljhandelsbolaget (Systembolaget).","Endast av detaljhandelsbolaget.","I vilken livsmedelsbutik som helst.","Direkt från utländska producenter utan mellanhand."],"correct":0,"explanation":"Den som har tillstånd för servering till allmänheten eller stadigvarande tillstånd för slutet sällskap får köpa av partihandlare eller Systembolaget.","law":"8 kap. 13 § AL"},{"id":"ser-058","category":"servering","topic":"inköp","question":"Var får den som har tillfälligt serveringstillstånd för slutna sällskap köpa alkoholdrycker?","answer":"Endast hos detaljhandelsbolaget (Systembolaget).","options":["Endast hos detaljhandelsbolaget (Systembolaget).","Av valfri partihandlare.","Direkt från tillverkaren.","I en vanlig livsmedelsbutik."],"correct":0,"explanation":"Tillfälliga tillstånd för slutna sällskap får endast köpa alkoholdrycker hos Systembolaget.","law":"8 kap. 13 § AL"},{"id":"ser-059","category":"servering","topic":"tillstånd","question":"Är ett serveringstillstånd knutet till en person eller till lokalen?","answer":"Det är knutet till tillståndshavaren. Vid ägarbyte krävs ny prövning, och betydande ägarförändringar ska anmälas.","options":["Det är knutet till tillståndshavaren. Vid ägarbyte krävs ny prövning, och betydande ägarförändringar ska anmälas.","Det är knutet till lokalen och följer med vid ägarbyte.","Det är knutet till kommunen.","Det är knutet till den serveringsansvarige."],"correct":0,"explanation":"Tillståndet bygger på en personlig lämplighetsprövning. Förändringar i ägarförhållanden och kretsen av PBI:er ska anmälas.","law":"8 kap. 12 § AL, 9 kap. 11 § AL"},{"id":"ser-060","category":"servering","topic":"tillstånd","question":"Får ett stadigvarande serveringstillstånd begränsas till viss tid?","answer":"Ja, om det finns särskilda skäl.","options":["Ja, om det finns särskilda skäl.","Nej, det gäller alltid tills vidare.","Endast om kommunen byter namn.","Endast om tillståndet avser folköl."],"correct":0,"explanation":"Stadigvarande tillstånd gäller tills vidare, men kommunen får av särskilda skäl begränsa giltigheten till viss tid.","law":"8 kap. 2 § AL"},{"id":"til-001","category":"tillsyn","topic":"tillsynsmyndigheter","question":"Vilken myndighet har den övergripande tillsynen över alkohollagen?","answer":"Folkhälsomyndigheten.","options":["Folkhälsomyndigheten.","Länsstyrelsen.","Kommunen.","Polismyndigheten."],"correct":0,"explanation":"Folkhälsomyndigheten har den övergripande tillsynen och meddelar föreskrifter enligt alkohollagen.","law":"9 kap. 1 § AL"},{"id":"til-002","category":"tillsyn","topic":"tillsynsmyndigheter","question":"Vilken myndighet har tillsyn inom länet och biträder kommunerna med råd?","answer":"Länsstyrelsen.","options":["Länsstyrelsen.","Folkhälsomyndigheten.","Skatteverket.","Konsumentverket."],"correct":0,"explanation":"Länsstyrelsen har tillsyn inom länet och ska ge råd och stöd till kommunerna.","law":"9 kap. 1 § AL"},{"id":"til-003","category":"tillsyn","topic":"tillsynsmyndigheter","question":"Vilka har tillsyn över efterlevnaden av bestämmelserna om servering?","answer":"Kommunen och Polismyndigheten.","options":["Kommunen och Polismyndigheten.","Endast Folkhälsomyndigheten.","Endast länsstyrelsen.","Skatteverket och Tullverket."],"correct":0,"explanation":"Kommunen och Polismyndigheten har tillsyn över serveringsbestämmelserna.","law":"9 kap. 2 § AL"},{"id":"til-004","category":"tillsyn","topic":"tillsynsmyndigheter","question":"Vilken myndighet har tillsyn över bestämmelsen om partihandel i 4 kap. 2 §?","answer":"Skatteverket.","options":["Skatteverket.","Folkhälsomyndigheten.","Kommunen.","Konsumentverket."],"correct":0,"explanation":"Skatteverket har tillsyn över efterlevnaden av 4 kap. 2 § AL.","law":"9 kap. 4 § AL"},{"id":"til-005","category":"tillsyn","topic":"tillsynsmyndigheter","question":"Vem har tillsyn över marknadsföringsbestämmelserna?","answer":"I första hand enligt marknadsföringslagen; kommunen får också utöva tillsyn över marknadsföring på serveringsstället.","options":["I första hand enligt marknadsföringslagen; kommunen får också utöva tillsyn över marknadsföring på serveringsstället.","Endast kommunen.","Endast Polismyndigheten.","Endast Folkhälsomyndigheten."],"correct":0,"explanation":"Marknadsföringslagen har särskilda regler om tillsyn. Kommunen får dessutom utöva tillsyn över marknadsföring på serveringsstället.","law":"9 kap. 3 § AL"},{"id":"til-006","category":"tillsyn","topic":"tillsynsmyndigheter","question":"Vad ska kommunen upprätta för tillsynen?","answer":"En tillsynsplan som ska ges in till länsstyrelsen.","options":["En tillsynsplan som ska ges in till länsstyrelsen.","En alkoholpolicy som ska godkännas av riksdagen.","En prislista som ska godkännas av Polismyndigheten.","Ingenting, tillsynen sker utan plan."],"correct":0,"explanation":"Kommunen ska upprätta en tillsynsplan och ge in den till länsstyrelsen.","law":"9 kap. 2 § AL"},{"id":"til-007","category":"tillsyn","topic":"anmälan","question":"Vad ska en tillståndshavare anmäla till kommunen?","answer":"När verksamheten påbörjas, läggs ned eller avbryts, samt förändringar av betydelse för tillsynen och betydande ägarförändringar.","options":["När verksamheten påbörjas, läggs ned eller avbryts, samt förändringar av betydelse för tillsynen och betydande ägarförändringar.","Endast när verksamheten läggs ned.","Endast när serveringsansvarig byts ut.","Ingenting, kommunen bevakar förändringar själv."],"correct":0,"explanation":"Anmälan ska göras i förväg, eller utan dröjsmål om förändringen inte kunnat förutses.","law":"9 kap. 11 § AL"},{"id":"til-008","category":"tillsyn","topic":"anmälan","question":"Inom vilken tid ska dödsboet anmäla att det vill fortsätta rörelsen efter tillståndshavarens död?","answer":"Senast två månader efter dödsfallet.","options":["Senast två månader efter dödsfallet.","Senast en månad efter dödsfallet.","Senast sex månader efter dödsfallet.","Det finns ingen tidsfrist."],"correct":0,"explanation":"Om anmälan inte kommit in inom två månader upphör tillståndet att gälla.","law":"9 kap. 12 § AL"},{"id":"til-009","category":"tillsyn","topic":"anmälan","question":"Vad händer med serveringstillståndet om tillståndshavaren försätts i konkurs?","answer":"Tillståndet upphör att gälla omedelbart. Konkursboet måste ansöka på nytt för att fortsätta.","options":["Tillståndet upphör att gälla omedelbart. Konkursboet måste ansöka på nytt för att fortsätta.","Tillståndet gäller i två månader.","Tillståndet övergår automatiskt till konkursboet.","Tillståndet påverkas inte alls."],"correct":0,"explanation":"Vid konkurs upphör tillståndet omedelbart. En ny ansökan från konkursboet behandlas med förtur.","law":"9 kap. 12 § AL"},{"id":"til-010","category":"tillsyn","topic":"tillsynsmyndigheter","question":"Vad ska tillståndshavaren göra vid tillsyn?","answer":"Lämna tillträde till lokaler, tillhandahålla handlingar, lämna varuprover och redovisa uppgifter om verksamheten.","options":["Lämna tillträde till lokaler, tillhandahålla handlingar, lämna varuprover och redovisa uppgifter om verksamheten.","Endast svara på frågor om ekonomin.","Endast visa upp serveringstillståndet.","Ingenting, tillsynen sker utan tillståndshavarens medverkan."],"correct":0,"explanation":"Tillståndshavaren ska utan ersättning hjälpa till vid tillsynen och lämna de uppgifter som behövs.","law":"9 kap. 13 § AL"},{"id":"til-011","category":"tillsyn","topic":"bokföring","question":"Vilka krav gäller för bokföringen i en tillståndspliktig rörelse?","answer":"Den ska vara utformad så att kontroll av verksamheten är möjlig, och handlingarna ska visas upp på begäran.","options":["Den ska vara utformad så att kontroll av verksamheten är möjlig, och handlingarna ska visas upp på begäran.","Den behöver inte vara kontrollerbar.","Den ska endast sparas i ett år.","Den ska skickas till Folkhälsomyndigheten varje månad."],"correct":0,"explanation":"Bokföringen ska vara så utformad att tillsynsmyndigheten kan kontrollera verksamheten.","law":"9 kap. 14 § AL"},{"id":"til-012","category":"tillsyn","topic":"bokföring","question":"Måste tillståndshavaren lämna statistiska uppgifter?","answer":"Ja, till tillsynsmyndigheten.","options":["Ja, till tillsynsmyndigheten.","Nej, statistik är frivillig.","Endast om kommunen begär det skriftligen.","Endast till Polismyndigheten."],"correct":0,"explanation":"Tillståndshavaren ska lämna de uppgifter som behövs för att myndigheten ska kunna föra statistik.","law":"9 kap. 14 § AL"},{"id":"til-013","category":"tillsyn","topic":"rapportering","question":"Vad är restaurangrapporten?","answer":"En årlig rapport om försäljningen som den som har stadigvarande serveringstillstånd ska lämna till Folkhälsomyndigheten.","options":["En årlig rapport om försäljningen som den som har stadigvarande serveringstillstånd ska lämna till Folkhälsomyndigheten.","En rapport som endast tillfälliga tillståndshavare lämnar.","En rapport som lämnas till Polismyndigheten varje vecka.","En rapport som endast gäller folkölsförsäljning."],"correct":0,"explanation":"Rapporten avser perioden 1 januari–31 december och lämnas till Folkhälsomyndighetens alkohol- och tobaksregister.","law":"FoHMFS 2014:5"},{"id":"til-014","category":"tillsyn","topic":"sanktioner","question":"Vilka sanktioner kan kommunen meddela en tillståndshavare?","answer":"Erinran, varning och återkallelse av serveringstillstånd.","options":["Erinran, varning och återkallelse av serveringstillstånd.","Endast böter.","Endast fängelse.","Endast indraget tillstånd utan föregående steg."],"correct":0,"explanation":"Sanktionerna trappas upp: erinran, varning och i allvarligare fall återkallelse.","law":"9 kap. 17–18 §§ AL"},{"id":"til-015","category":"tillsyn","topic":"sanktioner","question":"När får kommunen meddela erinran eller varning?","answer":"Om tillståndshavaren inte uppfyller kraven för tillståndet eller inte följer bestämmelserna för serveringen.","options":["Om tillståndshavaren inte uppfyller kraven för tillståndet eller inte följer bestämmelserna för serveringen.","Endast om tillståndshavaren har dömts för brott.","Endast om verksamheten går med vinst.","Endast om kommunen byter politisk majoritet."],"correct":0,"explanation":"Erinran eller varning kan meddelas vid brister i kraven eller vid överträdelser av lag, villkor eller föreskrifter.","law":"9 kap. 17 § AL"},{"id":"til-016","category":"tillsyn","topic":"sanktioner","question":"När ska kommunen återkalla ett serveringstillstånd?","answer":"Om tillståndet inte längre utnyttjas, om det förekommit brottslig verksamhet med tillståndshavarens vetskap utan ingripande, eller vid allvarliga eller upprepade överträdelser.","options":["Om tillståndet inte längre utnyttjas, om det förekommit brottslig verksamhet med tillståndshavarens vetskap utan ingripande, eller vid allvarliga eller upprepade överträdelser.","Endast om tillståndshavaren själv begär det.","Endast om verksamheten har stängt en dag.","Endast om kommunen inte har fått in restaurangrapporten."],"correct":0,"explanation":"Återkallelse är obligatorisk i vissa fall, bland annat när tillståndet inte utnyttjas eller vid allvarliga överträdelser.","law":"9 kap. 18 § AL"},{"id":"til-017","category":"tillsyn","topic":"sanktioner","question":"Vilka sanktioner gäller för servering eller detaljhandel med folköl?","answer":"Förbud att fortsätta verksamheten eller varning. Förbud gäller i sex månader, eller tolv månader vid upprepad eller allvarlig försummelse.","options":["Förbud att fortsätta verksamheten eller varning. Förbud gäller i sex månader, eller tolv månader vid upprepad eller allvarlig försummelse.","Endast böter.","Endast återkallelse av serveringstillstånd.","Inga sanktioner finns."],"correct":0,"explanation":"Kommunen får förbjuda folkölsförsäljning eller meddela varning om reglerna inte följs.","law":"9 kap. 19 § AL"},{"id":"til-018","category":"tillsyn","topic":"kontrollköp","question":"Vad är ett kontrollköp?","answer":"Ett köp som kommunen genomför för att kontrollera ålderskontrollen vid försäljning av folköl.","options":["Ett köp som kommunen genomför för att kontrollera ålderskontrollen vid försäljning av folköl.","Ett köp som en restaurang gör från en partihandlare.","Ett köp som Polismyndigheten gör vid brottsutredning.","Ett köp som en gäst gör via en app."],"correct":0,"explanation":"Kontrollköp används för att ge underlag för dialog om skyldigheten att förvissa sig om kundens ålder.","law":"9 kap. 15 a § AL"},{"id":"til-019","category":"tillsyn","topic":"kontrollköp","question":"Vilken ålder ska den som anlitas för ett kontrollköp ha?","answer":"Minst 18 år.","options":["Minst 18 år.","Minst 20 år.","Minst 25 år.","Under 18 år."],"correct":0,"explanation":"Kommunen får endast anlita en person som har fyllt 18 år för kontrollköp.","law":"9 kap. 15 a § AL"},{"id":"til-020","category":"tillsyn","topic":"kontrollköp","question":"Får ett kontrollköp genomföras utan att näringsidkaren underrättas i förväg?","answer":"Ja, men kommunen ska underrätta näringsidkaren snarast efter köpet.","options":["Ja, men kommunen ska underrätta näringsidkaren snarast efter köpet.","Nej, näringsidkaren måste alltid informeras i förväg.","Ja, och näringsidkaren behöver aldrig informeras.","Endast om Polismyndigheten deltar."],"correct":0,"explanation":"Kontrollköp får göras utan förvarning, men näringsidkaren ska underrättas snarast efteråt.","law":"9 kap. 15 a § AL"},{"id":"til-021","category":"tillsyn","topic":"kontrollköp","question":"Får resultatet av ett kontrollköp ensamt ligga till grund för förbud eller varning?","answer":"Nej.","options":["Nej.","Ja, alltid.","Ja, om köpet gjordes av en 18-åring.","Ja, om kommunen dokumenterade köpet."],"correct":0,"explanation":"Vad som framkommit genom kontrollköp får inte ensamt utgöra grund för förbud eller varning enligt 9 kap. 19 §.","law":"9 kap. 15 b § AL"},{"id":"til-022","category":"tillsyn","topic":"överklagande","question":"Vart överklagas ett beslut enligt alkohollagen?","answer":"Till allmän förvaltningsdomstol.","options":["Till allmän förvaltningsdomstol.","Till Folkhälsomyndigheten.","Till Polismyndigheten.","Till kommunfullmäktige."],"correct":0,"explanation":"Beslut enligt alkohollagen eller anslutande föreskrifter överklagas hos allmän förvaltningsdomstol.","law":"10 kap. 1 § AL"},{"id":"til-023","category":"tillsyn","topic":"överklagande","question":"Krävs prövningstillstånd för att överklaga till kammarrätten?","answer":"Ja.","options":["Ja.","Nej.","Endast i brottmål.","Endast om kommunen begär det."],"correct":0,"explanation":"Prövningstillstånd krävs vid överklagande till kammarrätten.","law":"10 kap. 1 § AL"},{"id":"til-024","category":"tillsyn","topic":"överklagande","question":"Gäller ett beslut enligt alkohollagen omedelbart?","answer":"Ja, om inte annat anges i beslutet.","options":["Ja, om inte annat anges i beslutet.","Nej, alltid först efter överklagandetiden.","Endast om det gäller ett tillfälligt tillstånd.","Endast om Polismyndigheten godkänner det."],"correct":0,"explanation":"Beslut enligt alkohollagen gäller omedelbart om inte annat anges i beslutet.","law":"10 kap. 1 § AL"},{"id":"til-025","category":"tillsyn","topic":"tillsynsmyndigheter","question":"Vilka ska få en kopia av kommunens beslut enligt alkohollagen?","answer":"Folkhälsomyndigheten, berörd länsstyrelse och Polismyndigheten. Vid marknadsföringsbeslut även Konsumentverket.","options":["Folkhälsomyndigheten, berörd länsstyrelse och Polismyndigheten. Vid marknadsföringsbeslut även Konsumentverket.","Endast sökanden.","Endast kommunfullmäktige.","Endast Polismyndigheten."],"correct":0,"explanation":"Kommunen ska skicka kopia av beslut till berörda myndigheter enligt 9 kap. 7 § AL.","law":"9 kap. 7 § AL"},{"id":"til-026","category":"tillsyn","topic":"tillståndsbevis","question":"Vem utfärdar tillståndsbeviset?","answer":"Kommunen.","options":["Kommunen.","Folkhälsomyndigheten.","Polismyndigheten.","Länsstyrelsen."],"correct":0,"explanation":"Kommunen ska utfärda bevis om tillstånd som kommunen har meddelat.","law":"9 kap. 7 § AL"},{"id":"til-027","category":"tillsyn","topic":"register","question":"Vem för det centrala alkohol- och tobaksregistret?","answer":"Folkhälsomyndigheten.","options":["Folkhälsomyndigheten.","Skatteverket.","Kommunen.","Polismyndigheten."],"correct":0,"explanation":"Folkhälsomyndigheten för ett centralt register för tillsyn, uppföljning, utvärdering och statistik.","law":"13 kap. 1 § AL"},{"id":"til-028","category":"tillsyn","topic":"register","question":"Vem har direktåtkomst till uppgifter om serveringstillstånd i registret?","answer":"Skatteverket, för sin tillsyn.","options":["Skatteverket, för sin tillsyn.","Alla kommuninvånare.","Endast Polismyndigheten.","Endast länsstyrelsen."],"correct":0,"explanation":"Skatteverket får för sin tillsyn ha direktåtkomst till uppgifter om serveringstillstånd i registret.","law":"13 kap. 4 § AL"},{"id":"til-029","category":"tillsyn","topic":"sanktioner","question":"Vad händer om den serveringsansvarige inte är närvarande under serveringstiden?","answer":"Det är ett brott mot alkohollagen och kan leda till erinran, varning eller återkallelse.","options":["Det är ett brott mot alkohollagen och kan leda till erinran, varning eller återkallelse.","Ingenting, det är valfritt.","Endast kommunen får böta den anställde.","Tillståndet återkallas automatiskt."],"correct":0,"explanation":"Tillståndshavaren eller utsedd serveringsansvarig ska ha tillsyn och vara närvarande under hela serveringstiden, med undantag för rumsservering.","law":"8 kap. 18 § AL"},{"id":"til-030","category":"tillsyn","topic":"avgifter","question":"Får kommunen ta ut en tillsynsavgift?","answer":"Ja.","options":["Ja.","Nej, tillsynen ska vara gratis.","Endast av tillfälliga tillståndshavare.","Endast om Folkhälsomyndigheten beslutar det."],"correct":0,"explanation":"Kommunen får ta ut avgift för tillsyn enligt grunder som kommunfullmäktige beslutar.","law":"8 kap. 10 § AL"},{"id":"til-031","category":"tillsyn","topic":"tillståndsbevis","question":"Vad är restaurangnummer?","answer":"Ett nummer som kommunen tilldelar ett serveringsställe vid stadigvarande serveringstillstånd och som följer lokalen.","options":["Ett nummer som kommunen tilldelar ett serveringsställe vid stadigvarande serveringstillstånd och som följer lokalen.","Ett nummer som Folkh
