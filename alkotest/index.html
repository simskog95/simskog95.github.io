älsomyndigheten tilldelar varje gäst.","Ett nummer som endast gäller för tillfälliga tillstånd.","Ett nummer som anger hur många sittplatser lokalen har."],"correct":0,"explanation":"Restaurangnumret finns i tillståndsbeviset och följer lokalen för att visa samtliga ägare. Även cateringstillstånd ska tilldelas restaurangnummer.","law":"FoHMFS 2014:6"},{"id":"til-032","category":"tillsyn","topic":"prov","question":"Vem räknas som person med betydande inflytande (PBI)?","answer":"Exempelvis ägare, verkställande direktör eller styrelseledamot som har ett betydande inflytande över verksamheten.","options":["Exempelvis ägare, verkställande direktör eller styrelseledamot som har ett betydande inflytande över verksamheten.","Endast den som är anställd som servitör.","Endast kommunens alkoholhandläggare.","Endast den serveringsansvarige."],"correct":0,"explanation":"PBI kan vara bland annat vd, firmatecknare, styrelseledamot, bolagsdelägare, aktieägare med betydande innehav eller verklig huvudman.","law":"FoHMFS 2014:7"},{"id":"til-033","category":"tillsyn","topic":"prov","question":"Hur många av personerna med betydande inflytande bör göra kunskapsprovet i ett mindre företag?","answer":"Minst hälften av de aktiva PBI:erna.","options":["Minst hälften av de aktiva PBI:erna.","Endast en person, oavsett hur många PBI:er det finns.","Alla PBI:er, utan undantag.","Ingen, om företaget är litet."],"correct":0,"explanation":"Enligt Folkhälsomyndighetens vägledning bör minst hälften av de PBI:er som själva är aktiva i serveringsverksamheten i ett mindre företag skriva provet.","law":"FoHMFS 2014:7"}]}</script>

<script>
(() => {
  "use strict";

  /* ------------------------------------------------------------------ *
   * Data
   * ------------------------------------------------------------------ */

  const DATA = JSON.parse(document.getElementById("alkoflash-data").textContent);
  const QUESTIONS = DATA.questions;
  const CATEGORIES = DATA.categories;

  const CAT_LABEL = {};
  const CAT_COUNTS = {};

  // "Bestämmelser om servering" -> "Servering"
  const shortName = (name) => {
    const stripped = name.replace(/^Bestämmelser om /, "");
    return stripped.charAt(0).toUpperCase() + stripped.slice(1);
  };

  for (const cat of CATEGORIES) {
    CAT_LABEL[cat.id] = shortName(cat.name);
    CAT_COUNTS[cat.id] = 0;
  }
  for (const q of QUESTIONS) {
    if (CAT_COUNTS[q.category] !== undefined) CAT_COUNTS[q.category] += 1;
  }

  /* ------------------------------------------------------------------ *
   * Helpers
   * ------------------------------------------------------------------ */

  const ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  const esc = (value) => String(value).replace(/[&<>"']/g, (ch) => ESCAPES[ch]);

  const ARROWS = ["A", "B", "C", "D", "E", "F"];

  function shuffle(list) {
    for (let i = list.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
  }

  const STORE_KEY = "alkoflash.v1";

  function readSettings() {
    try {
      return JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {};
    } catch {
      return {};
    }
  }

  function writeSettings() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        mode: state.mode,
        categories: [...state.categories],
        amount: state.amount,
      }));
    } catch {
      /* storage can be unavailable (private mode, file://); settings are optional */
    }
  }

  /* ------------------------------------------------------------------ *
   * State
   * ------------------------------------------------------------------ */

  const saved = readSettings();

  const savedCategories = Array.isArray(saved.categories)
    ? saved.categories.filter((id) => CAT_LABEL[id] !== undefined)
    : [];

  const state = {
    screen: "setup",          // setup | card | result
    mode: saved.mode === "quiz" ? "quiz" : "flash",
    categories: new Set(savedCategories.length ? savedCategories : CATEGORIES.map((c) => c.id)),
    amount: saved.amount === "all" || Number(saved.amount) > 0 ? saved.amount : "all",
    deck: [],
    index: 0,
    revealed: false,
  };

  const app = document.getElementById("app");

  const pool = () => QUESTIONS.filter((q) => state.categories.has(q.category));

  function deckSize() {
    const available = pool().length;
    if (state.amount === "all") return available;
    return Math.min(Number(state.amount), available);
  }

  /* ------------------------------------------------------------------ *
   * Deck
   * ------------------------------------------------------------------ */

  function buildDeck(list) {
    return list.map((q) => ({
      q,
      order: shuffle(q.options.map((_, i) => i)),
      picked: null,
      result: null,
    }));
  }

  function startPass(list) {
    state.deck = buildDeck(list);
    state.index = 0;
    state.revealed = false;
    state.screen = "card";
    render();
    window.scrollTo(0, 0);
  }

  function startSelected() {
    const shuffled = shuffle(pool().slice());
    const size = deckSize();
    if (size === 0) return;
    startPass(shuffled.slice(0, size));
  }

  function startEverything() {
    state.categories = new Set(CATEGORIES.map((c) => c.id));
    state.amount = "all";
    writeSettings();
    startSelected();
  }

  function advance() {
    if (state.index + 1 >= state.deck.length) {
      state.screen = "result";
      state.revealed = false;
      render();
      window.scrollTo(0, 0);
      return;
    }
    state.index += 1;
    state.revealed = false;
    render();
    window.scrollTo(0, 0);
  }

  function rate(result) {
    state.deck[state.index].result = result;
    advance();
  }

  function pickOption(pos) {
    const item = state.deck[state.index];
    if (item.picked !== null) return;
    const original = item.order[pos];
    item.picked = original;
    item.result = original === item.q.correct ? "got" : "missed";
    render();
  }

  /* ------------------------------------------------------------------ *
   * Render: setup
   * ------------------------------------------------------------------ */

  function renderSetup() {
    const available = pool().length;
    const size = deckSize();
    const amountOptions = [10, 20, 30, 50];

    // If the chosen amount exceeds what the selected categories offer, the
    // pass is the same as "all" — reflect that in the UI instead of leaving a
    // disabled chip looking selected.
    const effectiveAmount =
      state.amount === "all" || Number(state.amount) >= available ? "all" : state.amount;

    const catChips = CATEGORIES.map((cat) => {
      const on = state.categories.has(cat.id);
      return `
        <button type="button" class="chip" data-action="toggle-cat" data-cat="${esc(cat.id)}"
                aria-pressed="${on}" title="${esc(cat.description)}">
          ${esc(CAT_LABEL[cat.id])}
          <span class="count">${CAT_COUNTS[cat.id]}</span>
        </button>`;
    }).join("");

    const amountChips = amountOptions.map((n) => {
      const disabled = n > available;
      return `
        <button type="button" class="chip" data-action="set-amount" data-amount="${n}"
                aria-pressed="${effectiveAmount === n}" ${disabled ? "disabled" : ""}>
          ${n}
        </button>`;
    }).join("") + `
      <button type="button" class="chip" data-action="set-amount" data-amount="all"
              aria-pressed="${effectiveAmount === "all"}">
        Alla <span class="count">${available}</span>
      </button>`;

    const modeChips = `
      <button type="button" class="chip" data-action="set-mode" data-mode="flash"
              aria-pressed="${state.mode === "flash"}">Flashkort</button>
      <button type="button" class="chip" data-action="set-mode" data-mode="quiz"
              aria-pressed="${state.mode === "quiz"}">Quiz</button>`;

    const startLabel = size > 0
      ? `Starta ${size} ${size === 1 ? "kort" : "kort"}`
      : "Välj minst en kategori";

    const modeHint = state.mode === "flash"
      ? "Du ser frågan först och kan visa svaret när du tänkt klart."
      : "Fyra svarsalternativ. Du får rätt svar och förklaring direkt.";

    return `
      <section class="screen">
        <h2>Öva inför kunskapsprovet</h2>
        <p class="lede">
          ${QUESTIONS.length} frågor om alkohollagstiftningen, uppdelade på provets tre delområden.
          Välj kategori, antal och läge – eller kör allt i slumpad ordning.
        </p>

        <div class="panel">
          <div class="panel-head">
            <h3>Kategorier</h3>
            <span class="spacer"></span>
            <button type="button" class="link" data-action="cats-all">Alla</button>
            <button type="button" class="link" data-action="cats-none">Inga</button>
          </div>
          <div class="chips">${catChips}</div>
        </div>

        <div class="panel">
          <h3>Antal kort</h3>
          <div class="chips">${amountChips}</div>
        </div>

        <div class="panel">
          <h3>Läge</h3>
          <div class="chips">${modeChips}</div>
          <p class="muted" style="margin:12px 0 0;font-size:.85rem">${modeHint}</p>
        </div>

        <div class="start-row">
          <button type="button" class="btn btn-primary btn-lg" data-action="start"
                  ${size === 0 ? "disabled" : ""}>${esc(startLabel)}</button>
          <button type="button" class="btn" data-action="start-all">
            Allt, blandat – ${QUESTIONS.length} kort i slumpad ordning
          </button>
        </div>

        <details class="about">
          <summary>Om provet och källorna</summary>
          <ul>
            <li>Provet har tre delområden: alkoholpolitik, servering och tillsyn.</li>
            <li>Godkänt kräver minst <strong>75 % rätta svar i varje delområde</strong>.</li>
            <li>Resultatet gäller i fem år. Ett prov och två omprov ingår i ansökan.</li>
            <li>Provet finns på svenska, engelska och arabiska.</li>
          </ul>
          <p>${esc(DATA.meta.disclaimer)}</p>
          <p style="margin-bottom:4px"><strong>Källor</strong></p>
          <ul>
            ${DATA.meta.sources.map((s) => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)}</a></li>`).join("")}
          </ul>
          <p style="margin:0">Lagtext: ${esc(DATA.meta.lawVersion)}.</p>
        </details>
      </section>`;
  }

  /* ------------------------------------------------------------------ *
   * Render: card
   * ------------------------------------------------------------------ */

  function renderHud(item) {
    const total = state.deck.length;
    const pct = Math.round((state.index / total) * 100);
    return `
      <div class="hud">
        <button type="button" class="link" data-action="quit">Avsluta</button>
        <span class="counter">Kort ${state.index + 1} av ${total}</span>
      </div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${total}"
           aria-valuenow="${state.index}" aria-label="Framsteg">
        <span style="width:${pct}%"></span>
      </div>`;
  }

  function renderMeta(q) {
    return `
      <div class="card-meta">
        <span class="badge badge-${esc(q.category)}">${esc(CAT_LABEL[q.category] || q.category)}</span>
        <span class="topic">${esc(q.topic)}</span>
      </div>`;
  }

  function renderAnswerBlock(q) {
    return `
      <div class="answer" aria-live="polite">
        <p class="answer-text">${esc(q.answer)}</p>
        <p class="explanation">${esc(q.explanation)}</p>
        <p class="law"><span>Lagrum</span>${esc(q.law)}</p>
      </div>`;
  }

  function renderFlash(item) {
    const q = item.q;
    const actions = state.revealed
      ? `<button type="button" class="btn btn-miss" data-action="rate" data-rate="missed">Kunde inte</button>
         <button type="button" class="btn btn-got" data-action="rate" data-rate="got">Kunde</button>`
      : `<button type="button" class="btn btn-primary btn-lg" data-action="reveal">Visa svar</button>`;

    return `
      <article class="card">
        ${renderMeta(q)}
        <p class="question">${esc(q.question)}</p>
        ${state.revealed ? renderAnswerBlock(q) : ""}
      </article>

      <div class="actions">${actions}</div>

      <p class="kbd-hints">
        <kbd>Mellan slag</kbd> visa svar &nbsp;·&nbsp;
        <kbd>1</kbd> kunde inte &nbsp;·&nbsp;
        <kbd>2</kbd> kunde
      </p>`;
  }

  function renderQuiz(item) {
    const q = item.q;
    const answered = item.picked !== null;

    const options = item.order.map((original, pos) => {
      let cls = "opt";
      if (answered) {
        if (original === q.correct) cls += " is-correct";
        else if (original === item.picked) cls += " is-wrong";
        else cls += " is-dim";
      }
      return `
        <button type="button" class="${cls}" data-action="pick" data-pos="${pos}"
                ${answered ? "disabled" : ""}>
          <span class="key">${ARROWS[pos] || pos + 1}</span>
          <span>${esc(q.options[original])}</span>
        </button>`;
    }).join("");

    const verdict = answered
      ? `<p class="sr-only" aria-live="polite">${item.result === "got" ? "Rätt svar." : "Fel svar."}</p>`
      : "";

    const next = answered
      ? `<button type="button" class="btn btn-primary btn-lg" data-action="next">
           ${state.index + 1 >= state.deck.length ? "Visa resultat" : "Nästa fråga"}
         </button>`
      : "";

    return `
      <article class="card">
        ${renderMeta(q)}
        <p class="question">${esc(q.question)}</p>
        <div class="options">${options}</div>
        ${verdict}
        ${answered ? renderAnswerBlock(q) : ""}
      </article>

      ${answered ? `<div class="actions">${next}</div>` : ""}`;
  }

  function renderCard() {
    const item = state.deck[state.index];
    if (!item) {
      state.screen = "setup";
      return renderSetup();
    }
    const body = state.mode === "quiz" ? renderQuiz(item) : renderFlash(item);
    return `<section class="screen">${renderHud(item)}${body}</section>`;
  }

  /* ------------------------------------------------------------------ *
   * Render: result
   * ------------------------------------------------------------------ */

  function renderResult() {
    const total = state.deck.length;
    const got = state.deck.filter((i) => i.result === "got").length;
    const missed = state.deck.filter((i) => i.result !== "got");
    const pct = total ? Math.round((got / total) * 100) : 0;

    let message;
    if (pct >= 90) message = "Mycket starkt resultat. Dags att boka provet.";
    else if (pct >= 75) message = "I nivå med provets krav på 75 %. Repetera felen för marginal.";
    else if (pct >= 50) message = "Nära, men under 75 %. Repetera felen och kör igen.";
    else message = "Ta det i mindre bitar – repetera felen och bygg upp igen.";

    const perCategory = CATEGORIES.map((cat) => {
      const items = state.deck.filter((i) => i.q.category === cat.id);
      if (!items.length) return "";
      const correct = items.filter((i) => i.result === "got").length;
      const share = Math.round((correct / items.length) * 100);
      return `
        <div class="cat-row">
          <div class="cat-row-head">
            <span>${esc(CAT_LABEL[cat.id])}</span>
            <span>${correct} / ${items.length}</span>
          </div>
          <div class="progress"><span style="width:${share}%"></span></div>
        </div>`;
    }).join("");

    const missedList = missed.length
      ? `
        <div class="panel">
          <h3>Att repetera (${missed.length})</h3>
          ${missed.map((item) => {
            const q = item.q;
            const yourAnswer = item.picked !== null ? q.options[item.picked] : null;
            return `
              <div class="missed-item">
                <p class="q">${esc(q.question)}</p>
                ${yourAnswer && yourAnswer !== q.answer
                  ? `<p class="your">Ditt svar: ${esc(yourAnswer)}</p>`
                  : ""}
                <p class="a">${esc(q.answer)}</p>
                <p class="law"><span>Lagrum</span>${esc(q.law)}</p>
              </div>`;
          }).join("")}
        </div>`
      : "";

    return `
      <section class="screen">
        <div class="score">
          <div class="score-num">${pct}<span>%</span></div>
          <p class="score-sub">${got} av ${total} rätt</p>
          <p class="score-msg">${esc(message)}</p>
        </div>

        <div class="panel">
          <h3>Per delområde</h3>
          ${perCategory}
        </div>

        ${missedList}

        <div class="start-row">
          ${missed.length ? `<button type="button" class="btn btn-primary btn-lg" data-action="retry-missed">Repetera ${missed.length} fel</button>` : ""}
          <button type="button" class="btn btn-lg" data-action="again">Kör samma kort igen</button>
          <button type="button" class="btn btn-lg" data-action="restart">Nytt pass</button>
        </div>
      </section>`;
  }

  /* ------------------------------------------------------------------ *
   * Render dispatch
   * ------------------------------------------------------------------ */

  function render() {
    if (state.screen === "card") app.innerHTML = renderCard();
    else if (state.screen === "result") app.innerHTML = renderResult();
    else app.innerHTML = renderSetup();
  }

  function renderFooter() {
    const foot = document.getElementById("foot");
    foot.textContent =
      `${QUESTIONS.length} frågor · uppdaterad ${DATA.meta.updated} · ` +
      "studiematerial, inte officiella provfrågor";
  }

  /* ------------------------------------------------------------------ *
   * Events
   * ------------------------------------------------------------------ */

  app.addEventListener("click", (event) => {
    const trigger = event.target.closest("[data-action]");
    if (!trigger || trigger.disabled) return;

    const action = trigger.dataset.action;

    switch (action) {
      case "toggle-cat": {
        const id = trigger.dataset.cat;
        if (state.categories.has(id)) state.categories.delete(id);
        else state.categories.add(id);
        writeSettings();
        render();
        break;
      }
      case "cats-all":
        state.categories = new Set(CATEGORIES.map((c) => c.id));
        writeSettings();
        render();
        break;
      case "cats-none":
        state.categories = new Set();
        writeSettings();
        render();
        break;
      case "set-amount": {
        const raw = trigger.dataset.amount;
        state.amount = raw === "all" ? "all" : Number(raw);
        writeSettings();
        render();
        break;
      }
      case "set-mode":
        state.mode = trigger.dataset.mode === "quiz" ? "quiz" : "flash";
        writeSettings();
        render();
        break;
      case "start":
        startSelected();
        break;
      case "start-all":
        startEverything();
        break;
      case "reveal":
        state.revealed = true;
        render();
        break;
      case "rate":
        rate(trigger.dataset.rate === "got" ? "got" : "missed");
        break;
      case "pick":
        pickOption(Number(trigger.dataset.pos));
        break;
      case "next":
        advance();
        break;
      case "quit":
        state.screen = "setup";
        state.deck = [];
        state.index = 0;
        state.revealed = false;
        render();
        window.scrollTo(0, 0);
        break;
      case "retry-missed": {
        const missed = state.deck.filter((i) => i.result !== "got").map((i) => i.q);
        startPass(shuffle(missed));
        break;
      }
      case "again":
        state.deck.forEach((item) => { item.picked = null; item.result = null; });
        state.index = 0;
        state.revealed = false;
        state.screen = "card";
        render();
        window.scrollTo(0, 0);
        break;
      case "restart":
        state.screen = "setup";
        state.deck = [];
        state.index = 0;
        state.revealed = false;
        render();
        window.scrollTo(0, 0);
        break;
      default:
        break;
    }
  });

  document.addEventListener("keydown", (event) => {
    if (state.screen !== "card") return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.target.closest("button, input, textarea, summary")) return;

    const item = state.deck[state.index];
    if (!item) return;

    if (event.key === " " || event.key === "Enter") {
      if (state.mode === "flash" && !state.revealed) {
        event.preventDefault();
        state.revealed = true;
        render();
      } else if (state.mode === "quiz" && item.picked !== null) {
        event.preventDefault();
        advance();
      }
      return;
    }

    if (state.mode === "flash" && state.revealed) {
      if (event.key === "1") { event.preventDefault(); rate("missed"); return; }
      if (event.key === "2") { event.preventDefault(); rate("got"); return; }
    }

    if (state.mode === "quiz" && item.picked === null) {
      const digit = Number(event.key);
      if (Number.isInteger(digit) && digit >= 1 && digit <= item.order.length) {
        event.preventDefault();
        pickOption(digit - 1);
        return;
      }
    }

    if (event.key === "Escape") {
      event.preventDefault();
      state.screen = "setup";
      state.deck = [];
      state.index = 0;
      state.revealed = false;
      render();
    }
  });

  /* ------------------------------------------------------------------ *
   * Init
   * ------------------------------------------------------------------ */

  renderFooter();
  render();
})();
</script>
</body>
</html>
